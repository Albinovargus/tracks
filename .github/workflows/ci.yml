# Required GitHub Secrets:
#   RAILWAY_TOKEN          — Railway CLI deploy token (deploy workflows)
#   RAILWAY_SERVICE_ID     — Railway service ID (deploy workflows)
#   SUPABASE_ACCESS_TOKEN  — Supabase CLI auth (deploy workflows)
#   SUPABASE_DB_PASSWORD   — Supabase DB password (deploy workflows)
#   SENTRY_AUTH_TOKEN      — Sentry source map upload (deploy workflows)
#   SENTRY_ORG             — Sentry organization slug (deploy workflows)
#   SENTRY_PROJECT_WEB     — Sentry project for web app (deploy workflows)
#
# GitHub Variables (public values, Settings → Secrets and variables → Variables):
#   VITE_SUPABASE_URL      — Hosted Supabase project URL (GitHub Pages build)
#   VITE_SUPABASE_ANON_KEY — Supabase publishable/anon key (GitHub Pages build)
#   VITE_API_BASE_URL      — Hosted API URL, once deployed (GitHub Pages build)
#   VITE_SENTRY_DSN        — Sentry DSN for the web app (optional)
#   DEPLOY_API             — "true" to enable the Railway deploy job
#   SUPABASE_PROJECT_REF   — Hosted project ref; enables the migrate job
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps

      # The API dev server (tsx watch --env-file=.env) exits without apps/api/.env, so
      # create both .env files from the examples. REDIS_URL is dropped: CI has no Redis,
      # so rate limiting stays in memory. auth.spec.ts only needs the placeholder values.
      - run: grep -v '^REDIS_URL=' apps/api/.env.example > apps/api/.env && cp apps/web/.env.example apps/web/.env

      - run: pnpm exec playwright test
